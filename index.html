<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./Content/Styles/fonts.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #three-d, #video-container, #hud {
      position: absolute;
      margin: 0;
      padding: 0;
      overflow: auto;
    }
    #rendering {
      display: none;
      overflow: hidden;
      background-color: green;
    }
    .hidden {
      display: none;
    }
    #virtual-controls {
      position: absolute;
      z-index: 9999;
      font-size: 1rem;
      user-select: none;
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      padding: 5px;
    }
    #virtual-controls button {
      font-size: 1.2rem;
      margin: 3px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    #virtual-controls .row {
      text-align: center;
    }
  </style>
</head>
<body>
  <div id='three-d'></div>
  <video id='video-container' class='hidden' height='480px'></video>
  <canvas id='hud' width='640px' height='480px'></canvas>
  <canvas id='rendering' width='4096px' height='4096px'></canvas>
  <script type="module" src="./Content/Datas/Scripts/System/main.js"></script>

  <!-- 🔽 虛擬鍵盤控制區 -->
  <div id="virtual-controls">
    <div class="row"><strong>🎮 移動英雄</strong></div>
    <div class="row"><button onclick="pressKey('w')">W</button></div>
    <div class="row">
      <button onclick="pressKey('a')">A</button>
      <button onclick="pressKey('s')">S</button>
      <button onclick="pressKey('d')">D</button>
    </div>
    <div class="row"><strong>🎥 相機</strong></div>
    <div class="row">
      <button onclick="pressKey('ArrowLeft')">←</button>
      <button onclick="pressKey('ArrowRight')">→</button>
    </div>
    <div class="row"><strong>✅ 行動</strong></div>
    <div class="row">
      <button onclick="pressKey('Enter')">Enter</button>
    </div>
    <div class="row"><strong>❌ 取消 / 選單</strong></div>
    <div class="row">
      <button onclick="pressKey('x')">X</button>
      <button onclick="pressKey('Escape')">ESC</button>
    </div>
  </div>

  <!-- 🔽 JS 鍵盤模擬與對齊 HUD 畫面 -->
  <script>
    function pressKey(key) {
      document.dispatchEvent(new KeyboardEvent('keydown', { key }));
      setTimeout(() => {
        document.dispatchEvent(new KeyboardEvent('keyup', { key }));
      }, 100);
    }

    function positionVirtualControls() {
      const canvas = document.getElementById('hud');
      const controls = document.getElementById('virtual-controls');
      const rect = canvas.getBoundingClientRect();
      controls.style.left = `${rect.left + rect.width / 2}px`;
      controls.style.top = `${rect.bottom - 10}px`;
      controls.style.transform = 'translateX(-50%)';
    }

    window.addEventListener('resize', positionVirtualControls);
    window.addEventListener('load', () => {
      setTimeout(positionVirtualControls, 500);
    });
  </script>
</body>
</html>
