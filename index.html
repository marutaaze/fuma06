<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="./Content/Styles/fonts.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: black;
    }
    #three-d, #video-container, #hud, #rendering {
      position: absolute;
      margin: 0;
      padding: 0;
    }
    #rendering {
      display: none;
      background-color: green;
    }
    .hidden {
      display: none;
    }
    #virtual-controls {
      position: absolute;
      z-index: 9999;
      font-size: 1.5rem;
      user-select: none;
      pointer-events: auto;
    }
    #virtual-controls button {
      font-size: 1.2rem;
      margin: 5px;
      padding: 10px 14px;
    }
  </style>
</head>
<body>
  <div id='three-d'></div>
  <video id='video-container' class='hidden' height='480px'></video>
  <canvas id='hud' width='640px' height='480px'></canvas>
  <canvas id='rendering' width='4096px' height='4096px'></canvas>
  <script type="module" src="./Content/Datas/Scripts/System/main.js"></script>

  <!-- 🔽 虛擬按鈕 UI -->
  <div id="virtual-controls">
    <div style="text-align:center;">
      <button onclick="pressKey('w')">W</button>
    </div>
    <div style="text-align:center;">
      <button onclick="pressKey('a')">A</button>
      <button onclick="pressKey('s')">S</button>
      <button onclick="pressKey('d')">D</button>
    </div>
    <div style="text-align:center;">
      <button onclick="pressKey('ArrowLeft')">←</button>
      <button onclick="pressKey('Enter')">⏎</button>
      <button onclick="pressKey('ArrowRight')">→</button>
    </div>
    <div style="text-align:center;">
      <button onclick="pressKey('Escape')">ESC</button>
    </div>
  </div>

  <!-- 🔽 JS 模擬鍵盤事件 -->
  <script>
    function pressKey(key) {
      // 模擬鍵盤按下與放開
      window.dispatchEvent(new KeyboardEvent("keydown", { key }));
      setTimeout(() => {
        window.dispatchEvent(new KeyboardEvent("keyup", { key }));
      }, 100);
    }

    function positionControls() {
      const canvas = document.getElementById('hud');
      const controls = document.getElementById('virtual-controls');
      const rect = canvas.getBoundingClientRect();

      controls.style.left = `${rect.left + rect.width / 2}px`;
      controls.style.top = `${rect.bottom - 10}px`;
      controls.style.transform = 'translateX(-50%)';
    }

    window.addEventListener('resize', positionControls);
    window.addEventListener('load', () => {
      setTimeout(positionControls, 500);
    });
  </script>
</body>
</html>
